[project]
name = "Django-DMR"
version = "0.1.0"
description = "Django-DMR."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "celery[redis]>=5.6.3",
    "django>=6.0.7",
    "django-environ>=0.12.0",
    "django-modern-rest[jwt,msgspec,openapi,pydantic]>=0.11.0",
    "django-split-settings>=1.3.2",
    "email-validator>=2.3.0",
    "llama-index-core>=0.14.24",
    "llama-index-embeddings-openai>=0.6.0",
    "llama-index-llms-openai>=0.7.10",
    # Capped below 3.0: llama-index-llms-openai requires openai<3.
    "openai>=2.9.0,<3",
    "opensearch-py>=3.2.0",
    "psycopg[binary,pool]>=3.3.2",
    "pydantic>=2.13.4",
    "sentry-sdk>=2.0.0",
    "uvicorn>=0.51.0",
    "whitenoise>=6.9.0",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "django-stubs[compatible-mypy]>=6.0.7",
    "factory-boy>=3.3.3",
    "mypy>=2.3.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-django>=4.12.0",
    "ruff>=0.15.21",
]

# --- RUFF (Linter & Formatter) ---
[tool.ruff]
line-length = 79
target-version = "py314"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "TC",     # flake8-type-checking
    "DJ",     # flake8-django
    "ASYNC",  # flake8-async
    "D101",   # Missing docstring in public class
    "D102",   # Missing docstring in public method
    "D103",   # Missing docstring in public function
    "D200",   # Multi-line docstring that fits on one line
]
ignore = [
    "TC003",  # Keep stdlib annotations importable for runtime introspection.
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves annotations at runtime, so imports used only in the
# annotations of these models must stay importable at runtime.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "services.api.common.schemas.CamelCaseModel",
]

[tool.ruff.lint.extend-per-file-ignores]
"migrations/**.py" = ["E", "F", "I"]
"**/migrations/**.py" = ["E", "F", "I"]
"src/django_project/settings/*.py" = ["F821"]
"src/services/api/*/controllers.py" = ["TC001", "TC002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# --- MYPY (Type Checking) ---
[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
enable_error_code = ["explicit-override"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
# Neither LlamaIndex nor opensearch-py ship type information.
module = [
    "environ.*",
    "llama_index.*",
    "opensearchpy.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "*.migrations.*",
    "migrations.*",
    "*.tests.*",
    "django_project.settings.*",
    "conftest",
]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "django_project.settings"

# --- PYTEST ---
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "django_project.settings"
addopts = "--strict-markers --cov=src --cov-report=term-missing"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["src"]

# --- COVERAGE ---
[tool.coverage.run]
omit = [
    "src/**/tests/*",
    "src/conftest.py",
]

[tool.coverage.report]
show_missing = true
